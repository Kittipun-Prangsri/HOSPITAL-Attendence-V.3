<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Schedule Modal Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../public/css/staff-schedule-modal.css">
  <style>
    :root { --primary:#0f766e; --border:#dbe4ee; --muted:#475569; --text:#132238; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#ecfeff,#f8fafc); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .demo-card { width:min(640px,100%); padding:32px; border:1px solid var(--border); border-radius:22px; background:#fff; box-shadow:0 20px 48px rgba(15,35,56,.12); text-align:center; }
    .demo-card h1 { margin:0 0 8px; font-size:28px; }
    .demo-card p { margin:0 0 22px; color:var(--muted); }
    .demo-button { min-height:44px; padding:10px 18px; border:0; border-radius:11px; background:#0f766e; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    .demo-button:hover { background:#115e59; }
    .status-chip,.time-tag { display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:999px; font-size:11px; font-weight:700; }
    .chip-in { background:#dcfce7; color:#166534; }
    .chip-out { background:#e0f2fe; color:#075985; }
    .chip-late { background:#fef3c7; color:#92400e; }
    .chip-absent { background:#fee2e2; color:#b91c1c; }
    .time-tag { background:#ecfdf5; color:#166534; }
    .time-tag.out { background:#fef2f2; color:#b91c1c; }
    .loading-state { display:grid; place-content:center; justify-items:center; gap:8px; }
    .spinner-border { width:18px; height:18px; border:2px solid #cbd5e1; border-top-color:#0f766e; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <main class="demo-card">
    <h1>Staff Schedule Modal</h1>
    <p>ตัวอย่างแบบ Standalone ใช้ข้อมูลจำลอง ไม่ต้องเชื่อมต่อฐานข้อมูล</p>
    <button type="button" class="demo-button" id="openDemo">
      <i class="bi bi-calendar2-week" aria-hidden="true"></i> เปิดตารางเวรตัวอย่าง
    </button>
  </main>

  <div id="staffScheduleModal" class="staff-schedule-modal" role="dialog" aria-modal="true"
    aria-labelledby="staffScheduleName" aria-describedby="staffScheduleDescription" hidden>
    <div class="staff-schedule-dialog" role="document">
      <header class="staff-schedule-header">
        <div class="staff-schedule-person">
          <div id="staffScheduleAvatar" class="staff-schedule-avatar" aria-hidden="true"></div>
          <div>
            <h2 id="staffScheduleName" class="staff-schedule-name"></h2>
            <p id="staffScheduleMeta" class="staff-schedule-meta"></p>
          </div>
        </div>
        <button type="button" class="staff-schedule-close" data-staff-schedule-close aria-label="ปิดตารางเวร">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </header>
      <div id="staffScheduleChips" class="staff-schedule-chips"></div>
      <div class="staff-schedule-body">
        <div class="staff-schedule-toolbar">
          <div>
            <h3 class="staff-schedule-title"><i class="bi bi-calendar2-week" aria-hidden="true"></i> ตารางเวรประจำเดือน <span id="staffSchedulePeriod"></span></h3>
            <p id="staffScheduleDescription">แสดงกะงาน เวลาเข้า–ออก และสถานะลา</p>
          </div>
          <div class="staff-schedule-month-actions" aria-label="เปลี่ยนเดือน">
            <button type="button" data-staff-schedule-previous aria-label="เดือนก่อนหน้า"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
            <button type="button" data-staff-schedule-next aria-label="เดือนถัดไป"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
          </div>
        </div>
        <div id="staffScheduleCalendar" class="staff-schedule-calendar" aria-live="polite"></div>
        <div class="staff-schedule-legend" aria-label="คำอธิบายสี">
          <span><i class="legend-morning"></i>เวรเช้า</span>
          <span><i class="legend-afternoon"></i>เวรบ่าย</span>
          <span><i class="legend-night"></i>เวรดึก</span>
          <span><i class="legend-leave"></i>ลา</span>
          <span><i class="legend-off"></i>OFF</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../../public/js/staff-schedule-modal.js"></script>
  <script>
    const demoEmployee = {
      id: 'KHH0001',
      name: 'ดวงพร ยอดนาเลิศ',
      dept: 'กลุ่มงานบริหารทั่วไป',
      role: 'บุคลากร',
      shift: 'เช้า',
      status: 'late',
      in: '08:43',
      out: '16:43',
      hours: '8'
    };

    StaffScheduleModal.configure({
      getEmployees: () => [demoEmployee],
      getColors: () => ['#4f46e5'],
      getShiftDefinitions: () => ({ morning: { label: 'เช้า' } }),
      getSettings: () => ({ shifts: [{ name: 'เช้า' }, { name: 'บ่าย' }, { name: 'ดึก' }] }),
      loadSchedule: async ({ year, month }) => {
        const shifts = [];
        const times = [];
        const leaves = [];
        const shiftNames = ['เช้า', 'บ่าย', 'ดึก'];
        const days = new Date(year, month, 0).getDate();
        for (let day = 1; day <= days; day += 1) {
          const weekDay = new Date(year, month - 1, day).getDay();
          if (weekDay === 0 || weekDay === 6) continue;
          if (day === 14) { leaves.push({ day, reason: 'ลาป่วย' }); continue; }
          const shift = shiftNames[(day - 1) % shiftNames.length];
          shifts.push({ day, shift });
          times.push({ day, time_in: shift === 'เช้า' ? '08:40:00' : (shift === 'บ่าย' ? '16:35:00' : '00:32:00'), time_out: shift === 'เช้า' ? '16:42:00' : (shift === 'บ่าย' ? '00:30:00' : '08:35:00') });
        }
        return { success: true, shifts, times, leaves };
      }
    });

    document.getElementById('openDemo').addEventListener('click', () => StaffScheduleModal.open(demoEmployee));
  </script>
</body>
</html>
