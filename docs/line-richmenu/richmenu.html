<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=block" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body {
    font-family: "IBM Plex Sans Thai", sans-serif;
    /* same shell as the web sidebar: purple-900 → purple-950 */
    background: radial-gradient(1200px 700px at 0% 0%, rgba(236,72,153,.35), transparent 60%),
                radial-gradient(900px 700px at 100% 100%, rgba(168,85,247,.35), transparent 60%),
                linear-gradient(160deg, #581c87 0%, #3b0764 70%);
    display: grid;
    /* exact LINE 3x2 template cells so every card sits inside its tap area */
    grid-template-columns: 833px 834px 833px;
    grid-template-rows: 843px 843px;
  }
  .cell { padding: 26px; }
  .card {
    position: relative; height: 100%; border-radius: 64px; background: #fff;
    box-shadow: 0 24px 60px rgba(30, 0, 60, .35), inset 0 0 0 3px rgba(255,255,255,.6);
    padding: 70px 72px; display: flex; flex-direction: column; overflow: hidden;
  }
  .card::after { /* soft brand glow in the corner, like the web stat cards */
    content: ""; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px;
    border-radius: 50%; background: var(--glow); opacity: .14;
  }
  .icon {
    width: 250px; height: 250px; border-radius: 64px; display: grid; place-items: center;
    background: var(--grad); color: #fff; font-size: 140px;
    box-shadow: 0 18px 40px var(--shadow);
  }
  .label { margin-top: auto; font-size: 128px; font-weight: 700; color: #0f172a; line-height: 1.15; letter-spacing: -1px; }
  .sub { white-space: nowrap; margin-top: 18px; font-size: 54px; font-weight: 500; color: #64748b; line-height: 1.3; }
  .go {
    position: absolute; right: 64px; top: 92px; width: 116px; height: 116px; border-radius: 50%;
    display: grid; place-items: center; font-size: 60px; color: var(--ink); background: var(--soft);
  }
  .pink   { --grad: linear-gradient(135deg,#ec4899,#be185d); --glow:#ec4899; --shadow: rgba(236,72,153,.45); --soft:#fdf2f8; --ink:#db2777; }
  .purple { --grad: linear-gradient(135deg,#a855f7,#7e22ce); --glow:#a855f7; --shadow: rgba(168,85,247,.45); --soft:#faf5ff; --ink:#9333ea; }
  .amber  { --grad: linear-gradient(135deg,#f59e0b,#d97706); --glow:#f59e0b; --shadow: rgba(245,158,11,.45); --soft:#fffbeb; --ink:#d97706; }
  .sky    { --grad: linear-gradient(135deg,#38bdf8,#0284c7); --glow:#38bdf8; --shadow: rgba(14,165,233,.45); --soft:#f0f9ff; --ink:#0284c7; }
  .emerald{ --grad: linear-gradient(135deg,#34d399,#059669); --glow:#10b981; --shadow: rgba(16,185,129,.45); --soft:#ecfdf5; --ink:#059669; }
  /* brand tile: opens the full web system */
  .brand .card { background: linear-gradient(140deg,#ec4899 0%,#a21caf 55%,#6b21a8 100%); box-shadow: 0 24px 60px rgba(30,0,60,.45), inset 0 0 0 3px rgba(255,255,255,.35); }
  .brand .card::after { background:#fff; opacity:.12; }
  .brand .logo { width: 250px; height: 250px; border-radius: 64px; background:#fff; padding: 22px; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
  .brand .logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 40px; }
  .brand .label, .brand .sub { color: #fff; }
  .brand .sub { color: rgba(255,255,255,.85); }
  .brand .go { background: rgba(255,255,255,.2); color:#fff; }
</style></head>
<body>
  <div class="cell pink"><div class="card">
    <div class="icon"><i class="bi bi-person-bounding-box"></i></div><div class="go"><i class="bi bi-arrow-up-right"></i></div>
    <div class="label">สแกนล่าสุด</div><div class="sub">การ์ดเวลาเข้า–ออกล่าสุด</div>
  </div></div>
  <div class="cell purple"><div class="card">
    <div class="icon"><i class="bi bi-clock-history"></i></div><div class="go"><i class="bi bi-arrow-up-right"></i></div>
    <div class="label">ประวัติวันนี้</div><div class="sub">รายการสแกนของฉันวันนี้</div>
  </div></div>
  <div class="cell amber"><div class="card">
    <div class="icon"><i class="bi bi-file-earmark-text"></i></div><div class="go"><i class="bi bi-arrow-up-right"></i></div>
    <div class="label">ยื่นใบลา</div><div class="sub">สาย · ขาด · ลืมสแกน</div>
  </div></div>
  <div class="cell sky"><div class="card">
    <div class="icon"><i class="bi bi-calendar-week"></i></div><div class="go"><i class="bi bi-arrow-up-right"></i></div>
    <div class="label">ตารางเวร</div><div class="sub">เวรของฉันเดือนนี้</div>
  </div></div>
  <div class="cell emerald"><div class="card">
    <div class="icon"><i class="bi bi-umbrella"></i></div><div class="go"><i class="bi bi-arrow-up-right"></i></div>
    <div class="label">การลา</div><div class="sub">สิทธิ์คงเหลือ · ยื่นลาออนไลน์</div>
  </div></div>
  <div class="cell brand"><div class="card">
    <div class="logo"><img src="logo.jpg" alt=""></div><div class="go"><i class="bi bi-box-arrow-up-right"></i></div>
    <div class="label" style="white-space:nowrap;font-size:118px">KHH HRM</div><div class="sub" style="white-space:normal">โรงพยาบาลคลองหาด<br>เปิดระบบเต็มรูปแบบ</div>
  </div></div>
</body></html>
